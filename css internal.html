<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color:goldenrod;
            font-family: 'Courier New', Courier, monospace;
            font-family: italic;
        }
        .third{
            color: green
        }
        .fourth{
            color:blue
        }
    </style>
</head>
<body>
    <p style="color: red; font-family: 'Times New Roman', Times, serif;">This is the first sentence</p>
    <p>This is the second sentence</p>
    <p class="third">This is the third sentence</p>
    <p class="fourth">This is the fourth sentence</p>
</body>
</html>
